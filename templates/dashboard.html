{% extends 'base.html' %}
{% block content %}
<div class="dashboard">
  <div class="row">
    <div class="card stat">
      <h4>Total medicines</h4>
      <div id="total-meds">-</div>
    </div>
    <div class="card stat">
      <h4>Total sellable stock</h4>
      <div id="total-stock">-</div>
    </div>
    <div class="card stat">
      <h4>Batches expiring soon</h4>
      <div id="expiring-soon">-</div>
    </div>
  </div>

  <div class="card">
    <h3>Medicines</h3>
    <input id="search" placeholder="Search medicines">
    <table id="med-table">
      <thead><tr><th data-sort="name">Name</th><th data-sort="generic_name">Generic</th><th data-sort="manufacturer">Manufacturer</th><th data-sort="sellable_stock">Sellable</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="pagination">
      <button id="prev">Prev</button>
      <span id="page">1</span>
      <button id="next">Next</button>
    </div>
  </div>
</div>
{% endblock %}
